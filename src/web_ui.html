<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tablor</title>
<style>
  /* Dark sectioned panel in the spirit of the original Wavetable plugin
   * (SocaLabs): near-black ground, one boxed panel per section, amber
   * accents. Layout is generated from ui_pages.json, the same single
   * source as the hardware pages. */
  :root {
    --bg: #101114; --panel: #17181d; --edge: #2a2c34;
    --txt: #d8dae0; --dim: #7c8090; --acc: #e8a33d; --acc2: #5fb0c9;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--txt); margin: 0; padding: 10px;
    font: 12px/1.35 system-ui, -apple-system, sans-serif;
  }
  h1 {
    font-size: 15px; letter-spacing: .35em; margin: 2px 4px 10px;
    color: var(--acc); font-weight: 700;
  }
  h1 small { color: var(--dim); letter-spacing: .1em; font-weight: 400; margin-left: 8px; }
  #panels { display: flex; flex-wrap: wrap; gap: 8px; }
  .panel {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 6px;
    padding: 8px 10px 6px; flex: 1 1 260px; min-width: 240px;
  }
  .panel h2 {
    font-size: 10px; letter-spacing: .25em; color: var(--acc);
    margin: 0 0 6px; text-transform: uppercase; font-weight: 600;
    border-bottom: 1px solid var(--edge); padding-bottom: 4px;
  }
  .panel.global h2, .panel.user h2 { color: var(--acc2); }
  .ctl { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .ctl label { width: 92px; color: var(--dim); flex: none;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl output { width: 34px; text-align: right; color: var(--txt); flex: none;
                font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: var(--acc); height: 18px; min-width: 60px; }
  select {
    flex: 1; background: #0c0d10; color: var(--txt); border: 1px solid var(--edge);
    border-radius: 4px; padding: 2px 4px; font-size: 11px; min-width: 60px;
  }
  .file {
    flex: 1; background: #0c0d10; border: 1px dashed var(--edge); border-radius: 4px;
    padding: 3px 6px; color: var(--acc2); font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .note { color: var(--dim); margin: 8px 4px 0; font-size: 11px; }
</style>
</head>
<body>
  <h1>TABLOR<small>2-osc wavetable &middot; Schwung</small></h1>
  <div id="panels"></div>
  <p class="note">Wavetable picking happens on the device (OSC page, knobs 1/2
  step tables; click to browse with live preview). Everything else is live in
  both directions.</p>

<script src="/static/schwung-remote-api.js"></script>
<script>
(function () {
  "use strict";
  var K = "synth:";
  var controls = {};   /* key -> {set(valueString)} */

  function baseName(path) {
    if (!path) return "Init (built-in)";
    var n = path.substring(path.lastIndexOf("/") + 1);
    var d = n.lastIndexOf(".");
    return d > 0 ? n.substring(0, d) : n;
  }

  function makeControl(slot, into) {
    var row = document.createElement("div");
    row.className = "ctl";
    var lab = document.createElement("label");
    lab.textContent = slot.full.replace(/^(WT\d|LFO\d|Mod\d|Macro \d) /, "");
    lab.title = slot.full + " (" + slot.k + ")";
    row.appendChild(lab);

    if (slot.k === "preset") {
      /* unlimited user presets -> live stepping, not a static dropdown */
      var wrap = document.createElement("div");
      wrap.style.cssText = "flex:1;display:flex;gap:6px;align-items:center";
      var prev = document.createElement("button");
      var next = document.createElement("button");
      prev.textContent = "‹"; next.textContent = "›";
      prev.style.cssText = next.style.cssText =
        "background:#0c0d10;color:var(--txt);border:1px solid var(--edge);" +
        "border-radius:4px;width:26px;cursor:pointer";
      var nameEl = document.createElement("div");
      nameEl.className = "file";
      nameEl.textContent = "Init";
      var idx = 0;
      prev.addEventListener("click", function () {
        schwungRemote.setParam(K + "preset", String(Math.max(0, idx - 1)));
      });
      next.addEventListener("click", function () {
        schwungRemote.setParam(K + "preset", String(idx + 1));
      });
      wrap.appendChild(prev); wrap.appendChild(nameEl); wrap.appendChild(next);
      row.appendChild(wrap);
      controls[slot.k] = { set: function (v) { idx = parseInt(v, 10) || 0; } };
      schwungRemote.onParamChange(function (params) {
        if (params[K + "preset_name"] !== undefined)
          nameEl.textContent = params[K + "preset_name"] || "Init";
      });
    } else if (slot.b === "trigger") {
      var btn = document.createElement("button");
      btn.textContent = "Save";
      btn.style.cssText = "flex:1;background:var(--acc);color:#111;border:0;" +
        "border-radius:4px;padding:4px;font-weight:600;cursor:pointer";
      btn.addEventListener("click", function () {
        schwungRemote.setParam(K + slot.k, "1");
        btn.textContent = "Saved ✓";
        setTimeout(function () { btn.textContent = "Save"; }, 1200);
      });
      row.appendChild(btn);
      controls[slot.k] = { set: function () {} };
    } else if (slot.t === "file") {
      var f = document.createElement("div");
      f.className = "file";
      f.textContent = "Init (built-in)";
      row.appendChild(f);
      controls[slot.k] = { set: function (v) { f.textContent = baseName(v); } };
    } else if (slot.t === "enum") {
      var sel = document.createElement("select");
      slot.options.forEach(function (o, i) {
        var op = document.createElement("option");
        op.value = String(i);
        op.textContent = o;
        sel.appendChild(op);
      });
      sel.addEventListener("change", function () {
        schwungRemote.setParam(K + slot.k, sel.value);
      });
      row.appendChild(sel);
      controls[slot.k] = { set: function (v) {
        var i = slot.options.indexOf(v);
        sel.value = String(i >= 0 ? i : (parseInt(v, 10) || 0));
      } };
    } else {
      var r = document.createElement("input");
      r.type = "range";
      r.min = slot.min; r.max = slot.max; r.step = 1;
      var out = document.createElement("output");
      r.addEventListener("input", function () {
        out.value = r.value;
        schwungRemote.setParam(K + slot.k, r.value);
      });
      row.appendChild(r);
      row.appendChild(out);
      controls[slot.k] = { set: function (v) {
        r.value = v; out.value = Math.round(parseFloat(v) || 0);
      } };
    }
    into.appendChild(row);
  }

  fetch("ui_pages.json").then(function (r) { return r.json(); }).then(function (data) {
    var root = document.getElementById("panels");
    data.pages.forEach(function (page) {
      var p = document.createElement("div");
      p.className = "panel " + page.sec.toLowerCase().replace(/[^a-z]/g, "");
      var h = document.createElement("h2");
      h.textContent = page.name;
      p.appendChild(h);
      page.slots.forEach(function (s) { if (s) makeControl(s, p); });
      root.appendChild(p);
    });

    /* rename box in the Preset panel: renames the CURRENT User slot */
    var presetPanel = root.querySelector(".panel.preset");
    if (presetPanel) {
      var row = document.createElement("div");
      row.className = "ctl";
      var lab = document.createElement("label");
      lab.textContent = "Name";
      var inp = document.createElement("input");
      inp.type = "text";
      inp.maxLength = 14;
      inp.style.cssText = "flex:1;background:#0c0d10;color:var(--txt);" +
        "border:1px solid var(--edge);border-radius:4px;padding:3px 6px;font-size:11px";
      var ok = document.createElement("button");
      ok.textContent = "Rename";
      ok.style.cssText = "background:var(--acc2);color:#111;border:0;" +
        "border-radius:4px;padding:3px 8px;font-weight:600;cursor:pointer";
      ok.addEventListener("click", function () {
        if (inp.value.trim())
          schwungRemote.setParam(K + "preset_name", inp.value.trim());
      });
      row.appendChild(lab); row.appendChild(inp); row.appendChild(ok);
      presetPanel.appendChild(row);
      schwungRemote.onParamChange(function (params) {
        if (params[K + "preset_name"] !== undefined)
          inp.placeholder = params[K + "preset_name"];
      });
    }

    schwungRemote.onParamChange(function (params) {
      for (var key in params) {
        if (key.indexOf(K) !== 0) continue;
        var c = controls[key.substring(K.length)];
        if (c) c.set(params[key]);
      }
    });
  });
})();
</script>
</body>
</html>
